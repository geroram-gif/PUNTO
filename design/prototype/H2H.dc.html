<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PUNTO. Cara a cara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #19283B">
  <dc-import name="App" pantalla="cara a cara" rival="{{ rival }}" carga="{{ carga }}" escenario="{{ escenario }}" simular-error-de-red="{{ simularErrorDeRed }}" nombres-largos="{{ nombresLargos }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rivalInicial":{"editor":"enum","options":["nico","fran","pipo","gonza","fede"],"default":"nico"},"escenario":{"editor":"enum","options":["demo","grupo sin partidos"],"default":"demo"},"nombresLargos":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rival: this.props.rivalInicial || 'nico', carga: false, escenario: this.props.escenario || 'demo', simularErrorDeRed: false, nombresLargos: !!this.props.nombresLargos };
  }
}
</script>
</body>
</html>
